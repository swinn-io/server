build:
  environment:
    php: '8.2'
    mysql: true

  dependencies:
    override:
      - composer install --no-interaction --prefer-dist

  tests:
    override:
      - command: cp .env.example .env
      - command: php artisan key:generate
      - command: until mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null 2>&1; do sleep 1; done
      - command: mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS \`swinn-test\`;"
      - command: php artisan migrate --force
      - command: php artisan passport:install --no-interaction
      - command: vendor/bin/phpunit
        coverage:
          file: build/logs/clover.xml
          format: clover
        environment:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: swinn-test
          DB_USERNAME: root
          DB_PASSWORD: ''

checks:
  php:
    code_rating: true
    duplication: true